# 自动打 Windows 安装包：每次 push 到 main 或手动触发，在 GitHub 的 Windows 服务器上构建 NSIS 安装包并发布到 Releases。
# 注意：本文件里没有任何 Key、Token、密钥。
# 注：端到端测试脚本是 bash 版（Linux 沙箱已验过 152/0 与 11/0），Windows runner 上只跑类型检查，不跑 bash 测试。
name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # --publish never：打包时不让 electron-builder 自己发布（它在 CI 里检测到发布配置会去要 GH_TOKEN，缺了就报错）；发版统一走下面 gh release 那步。
      - name: Package NSIS installer
        run: npm run build && npx electron-builder --win nsis --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $f = Get-Item release/MonitorWorkbench-Setup-0.3.1.exe
          Write-Output "installer size: $($f.Length) bytes"
          Write-Output "installer SHA-256: $((Get-FileHash $f -Algorithm SHA256).Hash)"
          if ($f.Length -lt 80MB) { throw "安装包太小（$($f.Length) 字节），未完成" }
          if (-not (Test-Path release/latest.yml)) { throw 'latest.yml 缺失，自动更新元数据没生成' }
          $ym = Get-Content release/latest.yml -Raw
          if ($ym -notmatch 'version: 0.3.1') { throw 'latest.yml 里的版本号不是 0.3.1' }
          if ($ym -notmatch 'MonitorWorkbench-Setup-0.3.1.exe') { throw 'latest.yml 里的安装包文件名不对' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonitorWorkbench-Setup-0.3.1
          path: release/MonitorWorkbench-Setup-0.3.1.exe
          if-no-files-found: error

      - name: Publish to Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.1 release/MonitorWorkbench-Setup-0.3.1.exe --title '监控账号工作台 0.3.1' --notes 'Windows 安装包（NSIS，per-user 一键安装，无需管理员权限）。账号页新增显眼的添加入口与批量添加：一次粘贴多行主页链接、逐行显示添加结果；三平台浏览器采集与置顶规则不变。视频与文件全部存在本机，每天 8:00 自动采集、每账号最新 5 条、保留 3 天、平台分组排序、预览与 ZIP 下载。' --target main
          if ($LASTEXITCODE -ne 0) { gh release upload v0.3.1 release/MonitorWorkbench-Setup-0.3.1.exe --clobber }
          gh release upload v0.3.1 release/latest.yml --clobber
          if (Test-Path release/MonitorWorkbench-Setup-0.3.1.exe.blockmap) { gh release upload v0.3.1 release/MonitorWorkbench-Setup-0.3.1.exe.blockmap --clobber }
